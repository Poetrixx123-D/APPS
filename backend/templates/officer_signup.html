<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APPS - Officer Registration</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  (function(){
    var t = localStorage.getItem('apps_theme');
    if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
</head>
<body>

<div style="position:fixed; top:20px; right:24px; z-index:90;">
  <button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <span class="theme-toggle-icon">🌙</span>
  </button>
</div>

<div class="auth-shell">

  <div class="auth-brand-panel">
    <div class="brand-mark">APPS</div>
    <h1>Welfare Officer Registration</h1>
    <p>Register your Welfare Officer account to coordinate stress monitoring, support requests, and counseling.</p>
  </div>

  <div class="auth-form-panel">
    <div class="auth-card">
      <div class="brand">APPS <span>•</span> OFFICER</div>
      <h1>Officer Sign Up</h1>

      {% if error %}
        <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/officer_signup">
        <label>Name</label>
        <input type="text" name="name" required autofocus>

        <label>Unit</label>
        <input type="text" name="unit" placeholder="e.g. 1st Infantry / Alpha" required>

        <label>Password</label>
        <input type="password" name="password" minlength="6" placeholder="Minimum 6 characters" required>

        <button type="submit" class="btn">Register as Officer</button>
      </form>

      <p class="foot-link">Already registered as an Officer? <a href="/officer_login">Officer Login</a></p>
      <p class="foot-link" style="margin-top:14px;"><a href="/portal" style="color:var(--steel); text-decoration:none;">← Back to Portal Selection</a></p>
    </div>
  </div>

</div>

<script>
  (function(){
    function updateIcons(dark) {
      document.querySelectorAll('.theme-toggle-icon').forEach(function(i){ i.textContent = dark ? '☀️' : '🌙'; });
    }
    updateIcons(document.documentElement.classList.contains('dark'));
    document.querySelectorAll('.theme-toggle').forEach(function(btn){
      btn.addEventListener('click', function(){
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('apps_theme', isDark ? 'dark' : 'light');
        updateIcons(isDark);
      });
    });
  })();
</script>

</body>
</html>
